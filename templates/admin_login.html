{% extends "base.html" %}

{% block title %}Admin Login - Secure Certificate System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-box-arrow-in-right me-2"></i> Admin Login
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin_login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-university w-100">Login</button>
                </form>
                <p class="text-muted small mt-3 mb-0">Default: admin / admin123 (change in production)</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
