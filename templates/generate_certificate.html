{% extends "base.html" %}

{% block title %}Generate Certificate - Secure Certificate System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-award me-2"></i> Generate Certificate
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('generate_certificate') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="participant_name" class="form-label">Participant Name</label>
                        <input type="text" class="form-control" id="participant_name" name="participant_name" required placeholder="e.g. John Doe">
                    </div>
                    <div class="mb-3">
                        <label for="university_id" class="form-label">University ID</label>
                        <input type="text" class="form-control" id="university_id" name="university_id" required placeholder="e.g. UID12345">
                    </div>
                    <div class="mb-4">
                        <label for="event_name" class="form-label">Event Name</label>
                        <input type="text" class="form-control" id="event_name" name="event_name" required placeholder="e.g. Python Workshop 2025">
                    </div>
                    <button type="submit" class="btn btn-university w-100">
                        <i class="bi bi-file-earmark-pdf me-2"></i>Generate PDF Certificate
                    </button>
                </form>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary mt-3">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
